<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversation Laboratory · Six Characters</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="shell">
        <!-- CHARACTER AND SCENARIO SELECTOR -->
        <header class="masthead">
            <h1>Conversation Laboratory</h1>
            <nav class="character-nav" aria-label="Choose a conversation" id="character-nav"></nav>
        </header>

        <div class="layout">
            <!-- CHARACTER AND VISUAL DISCOVERY -->
            <section class="portrait-panel" aria-label="Character and visual discovery">
                <div class="portrait-frame character-portrait" id="portrait">
                    <div class="character-monogram" id="character-monogram" aria-hidden="true"></div>
                    <div class="character-name" id="character-name"></div>
                </div>

                <div class="presence">
                    <span id="light" class="light"></span>
                    <span id="avatar-state"></span>
                </div>

                <div class="discovery-space">
                    <div class="discovery-tabs">
                        <button id="show-meaning" aria-expanded="false">Meaning &amp; Usage</button>
                        <button id="show-discovery" aria-expanded="false">Explore This Expression</button>
                    </div>

                    <div id="visual-stage" class="visual-stage" aria-live="polite"></div>
                    <div id="discovery-detail" class="discovery-detail" hidden></div>
                </div>
            </section>

            <!-- CONVERSATION AND SPEAKING -->
            <section class="conversation" aria-label="Conversation">
                <div class="scenario" id="scenario"></div>
                <h2 id="conversation-title"></h2>

                <div class="dialogue">
                    <div class="who" id="speaker-label"></div>
                    <p id="russian" lang="ru"></p>
                    <p id="translation"></p>
                </div>

                <div class="buttons">
                    <button id="hear">▶ Hear</button>
                    <button id="answer" class="primary">🎙 Answer aloud</button>
                    <button id="repeat">↻ Start over</button>
                </div>

                <div class="heard">
                    <div class="who">I HEARD</div>
                    <p id="transcript"></p>
                </div>

                <div id="feedback" class="feedback" role="status"></div>

                <section class="assistance">
                    <h3>Conversation Assistance</h3>
                    <div class="assist-actions">
                        <button id="show-answers" aria-expanded="false">See Possible Answers</button>
                        <button id="practice-phrase">You Try To Say It</button>
                        <button id="hear-again">Hear It Again</button>
                    </div>
                    <div id="answers-panel" class="assist-panel" hidden></div>
                    <p id="practice-status" class="assist-note" role="status"></p>
                </section>

                <div class="fallback">
                    <label for="typed">Or type your response</label>
                    <div class="type-row">
                        <input id="typed" lang="ru" autocomplete="off" placeholder="Ваш ответ…">
                        <button id="send">Submit Response</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>

</html>
